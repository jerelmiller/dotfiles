set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"

set-option -g history-limit 10000

set -s escape-time 0

set-option -g focus-events on

# Change prefix to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Use r to reload tmux conf after changes
bind r source-file ~/.tmux.conf

# make window/pane index start with 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Switch to the last session instead of detaching when the current one dies
set -g detach-on-destroy off

# open new windows with current path of pane
bind c new-window -c "#{pane_current_path}"

# disable confirmation before closing windows and panes
bind-key & kill-window
bind-key x kill-pane

# use \ and - to split windows
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

set-window-option -g mode-keys vi
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

bind-key C-j choose-session

set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_current_left_separator ' '
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator ' '

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Allow some escape sequences through. Useful for claude code
set -g allow-passthrough on

run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'

run '~/.tmux/plugins/tpm/tpm'
